# VORON 2.4 350mm — Extruder
# Separated from the toolhead board file so board-specific config can be swapped
# independently. Pins: LDO Nitehawk-36 (nhk). Updated Oct 2026 for A4T/WW-BMG.


[extruder]
step_pin: nhk:gpio23
dir_pin: nhk:gpio24
enable_pin: !nhk:gpio25

##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
rotation_distance: 21.534      # WW-BMG + RIDGA v2, calibrated 2026-10-31 (48.0 of 50 mm at 246C, from 22.431590)
##  Update Gear Ratio depending on your Extruder Type
gear_ratio: 50:10               #BMG Gear Ratio
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 150

##  PA managed by Orca Slicer filament profiles — 0 here makes slicer failure obvious
pressure_advance: 0
##  smooth_time is a lookahead window. Range 0.02-0.04.
pressure_advance_smooth_time: 0.02

heater_pin: nhk:gpio9
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk:gpio29
# Nitehawk thermistor circuit uses a 2.2k pullup (LDO spec)
pullup_resistor: 2200
# FIX: was 0 — disconnected thermistor reads 0C and Klipper considers it valid.
# 10C is below any realistic ambient so anything lower is clearly a sensor fault.
min_temp: 10
max_temp: 290

# sensor_type:MAX31865
# sensor_pin: (MAX31865 not used on Nitehawk)
# spi_bus: spi1
# rtd_nominal_r: 100
# rtd_reference_r: 430
# rtd_num_of_wires: 2

[tmc2209 extruder]
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
interpolate: false
# LDO recommends below 0.7A on the Nitehawk. Tune later.
run_current: 0.6
sense_resistor: 0.100
stealthchop_threshold: 0
