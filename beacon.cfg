# VORON 2.4 350mm - Beacon RevH (contact + proximity)
# Replaces probe.cfg (TAP). [beacon] replaces [probe] and takes over Z homing,
# so [homing_override] must be removed from printer.cfg (Beacon's homing does
# not work alongside it).
# Source: docs.beacon3d.com (quickstart, config, contact), read 2026-10-21.
# Option names re-checked against beacon_klipper beacon.py (commit 3eb0134) 2026-10-30.
# beacon.py refuses home_xy_position alongside [homing_override] or [safe_z_home].


[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_F2E9E3A14E5737374D202020FF062026-if00
# Coil center relative to the nozzle on the Vitalii XOL/A4T mount, measured 2026-10-30.
# Re-measure after the Monolith spacer. Wrong values shift the mesh, not Z.
x_offset: 0
y_offset: 20
mesh_main_direction: x
mesh_runs: 2

# Contact homing. First G28 touches the nozzle to the bed and calibrates the
# proximity model; once homed, G28 Z uses proximity (faster, no nozzle contact).
# The 2.4's SMART_QGL forces one hot contact recalibration after leveling.
home_method: contact
home_method_when_homed: proximity
home_autocalibrate: unhomed
# Nozzle must be at or below this to contact. PRINT_START and ZERO_TOUCH_PREP
# already hold the nozzle at 150C for probing (originally for TAP).
contact_max_hotend_temperature: 180

# Matches the old homing_override: Z hop 5mm, home at bed center, 300mm/s XY.
home_xy_position: 175, 175
home_z_hop: 5
home_z_hop_speed: 15
home_xy_move_speed: 300
