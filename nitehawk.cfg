# VORON 2.4 350mm — LDO Nitehawk-36 Rev C Toolhead Board (USB, RP2040)
# Replaces EBBCan.cfg (A4T upgrade, Oct 2026). Pins from LDO's official sample config:
# github.com/MotorDynamicsLab/Nitehawk-36/Configs/nitehawk-36.cfg
# Extruder config lives in extruder.cfg — swap that file when changing toolhead boards.


[mcu nhk]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3434343339138C2D-if00
restart_method: command


## Onboard ADXL345
[adxl345]
cs_pin: nhk:gpio27
spi_software_sclk_pin: nhk:gpio18
spi_software_mosi_pin: nhk:gpio20
spi_software_miso_pin: nhk:gpio19
# Board mounts upright on the A4T. ShakeTune AXES_MAP_CALIBRATION 2026-10-30
# (X, Y 100% confidence; Z 62%, confirmed by gravity reading -9844 on accel Y).
axes_map: -x,-z,-y


[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20    # center of 350mm bed
