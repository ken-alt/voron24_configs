# VORON 2.4 350mm - crowsnest v5 (chamber camera)
# Raspberry Pi HQ Camera (IMX477) on the Pi 4's CSI port, 6mm IR CS-mount lens,
# articulating arm on the rear corner extrusion. Installed 2026-10-30.
# Source: github.com/mainsail-crew/crowsnest (v5 branch), read 2026-10-30.
# Port 8080 = /webcam/?action=stream and /webcam/?action=snapshot in Mainsail.

[crowsnest]
log_level: verbose
rollover_on_start: false
no_proxy: false

[cam 1]
# camera-streamer drives CSI cameras through libcamera (supported on the Pi 4, not the Pi 5).
mode: camera-streamer
port: 8080
# libcamera path, from: rpicam-hello --list-cameras
device: /base/soc/i2c0mux/i2c@1/imx477@1a
# 1080p is the Pi 4's hardware encoder sweet spot; 15 fps is plenty for print monitoring.
resolution: 1920x1080
max_fps: 15
